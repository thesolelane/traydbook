<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">

  <!-- Circle background -->
  <circle cx="150" cy="148" r="132" fill="#C04A22"/>

  <!-- === ICON: Hammer + Book/T shape === -->

  <!-- Shadow layer (offset down-right slightly) -->
