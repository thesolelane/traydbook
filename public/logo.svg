    <!-- Hammer handle -->
    <rect x="116" y="106" width="14" height="62" rx="5" transform="rotate(18,123,106)"/>
  </g>

  <!-- TraydBook text -->
  <text
    x="150"
    y="330"
    text-anchor="middle"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="700"
