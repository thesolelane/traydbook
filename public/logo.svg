    <!-- T crossbar -->
    <rect x="80" y="90" width="138" height="30" rx="6"/>
    <!-- T vertical stem -->
    <rect x="130" y="116" width="38" height="76" rx="4"/>
    <!-- Book left page -->
    <path d="M130 188 Q108 196 112 222 L148 222 L148 188 Z"/>
    <!-- Book right page -->
    <path d="M168 188 Q190 196 186 222 L150 222 L150 188 Z"/>
    <!-- Book spine line -->
    <rect x="147" y="188" width="4" height="34" rx="2"/>
    <!-- Hammer head -->
    <path d="M72 82 L122 82 Q130 82 130 90 L130 108 Q130 116 122 116 L72 116 Q64 116 64 108 L64 90 Q64 82 72 82 Z"/>
    <!-- Hammer handle -->
    <rect x="118" y="108" width="14" height="62" rx="5" transform="rotate(18,125,108)"/>
  </g>

  <!-- White icon layer -->
  <g fill="white">
