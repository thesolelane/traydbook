<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooperanth Sim Runner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #1e2533;
    }

    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
    h1 span { color: #60a5fa; }

    .subtitle { font-size: 0.8rem; color: #64748b; margin-top: 0.2rem; }

    .refresh-info { font-size: 0.75rem; color: #475569; }

    .secret-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      align-items: center;
    }

    .secret-bar input {
      flex: 1;
      max-width: 380px;
      padding: 0.5rem 0.75rem;
      background: #1e2533;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.85rem;
    }

    .secret-bar input:focus { outline: none; border-color: #60a5fa; }

    button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-run     { background: #1e3a5f; color: #60a5fa; font-size: 0.78rem; padding: 0.35rem 0.75rem; }
    .btn-output  { background: #1e2533; color: #94a3b8; font-size: 0.78rem; padding: 0.35rem 0.75rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .card {
      background: #1a1f2e;
      border: 1px solid #1e2533;
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #2d3748; }
    .card.pass  { border-left: 3px solid #22c55e; }
    .card.fail  { border-left: 3px solid #ef4444; }
    .card.running { border-left: 3px solid #f59e0b; }
    .card.never { border-left: 3px solid #334155; }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-title  { font-weight: 700; font-size: 1rem; }
    .card-desc   { font-size: 0.75rem; color: #64748b; margin-top: 0.2rem; }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .badge.pass    { background: #14532d; color: #4ade80; }
    .badge.fail    { background: #450a0a; color: #f87171; }
    .badge.running { background: #451a03; color: #fbbf24; }
    .badge.never   { background: #1e2533; color: #475569; }

    .stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.82rem;
      color: #94a3b8;
    }
    .stats strong { color: #e2e8f0; font-size: 1rem; }

    .progress-bar {
      height: 4px;
      background: #1e2533;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #22c55e;
      transition: width 0.4s;
    }
    .progress-fill.fail { background: #ef4444; }

    .card-footer { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .timestamp { font-size: 0.72rem; color: #475569; margin-left: auto; }

    .output-panel {
      display: none;
      margin-top: 0.75rem;
      background: #0f1117;
      border: 1px solid #1e2533;
      border-radius: 6px;
      padding: 0.75rem;
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.72rem;
      line-height: 1.6;
      color: #94a3b8;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .output-panel.visible { display: block; }

    .empty {
      text-align: center;
      color: #475569;
      padding: 4rem;
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid #f59e0b;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.3rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Cooperanth <span>Sim Runner</span></h1>
    <div class="subtitle">End-to-end health checks across all apps</div>
  </div>
  <div class="refresh-info" id="refreshInfo">Auto-refreshes every 30s</div>
</header>

<div class="secret-bar">
  <input type="password" id="secretInput" placeholder="Paste SIM_SECRET to enable Run buttons..." />
  <button class="btn-primary" onclick="saveSecret()">Save</button>
</div>

<div class="grid" id="grid">
  <div class="empty">Enter your SIM_SECRET above and the dashboard will load.</div>
</div>

<script>
  let secret = localStorage.getItem('sim_secret') || ''
  if (secret) document.getElementById('secretInput').value = secret

  function saveSecret() {
    secret = document.getElementById('secretInput').value.trim()
    localStorage.setItem('sim_secret', secret)
    load()
  }

  function relTime(iso) {
    if (!iso) return '—'
    const diff = Date.now() - new Date(iso).getTime()
    if (diff < 60000) return 'just now'
    if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`
    return new Date(iso).toLocaleDateString()
  }

  function statusClass(app) {
    if (app.running) return 'running'
    if (!app.last)   return 'never'
    return app.last.status
  }

  function renderCard(app) {
    const st   = statusClass(app)
    const last = app.last
    const pct  = last && last.total ? Math.round((last.pass / last.total) * 100) : 0

    const badgeLabel = app.running ? 'Running…' : (last ? last.status.toUpperCase() : 'NEVER RUN')

    return `
      <div class="card ${st}" id="card-${app.id}">
        <div class="card-header">
          <div>
            <div class="card-title">${app.name}</div>
            <div class="card-desc">${app.desc}</div>
          </div>
          <span class="badge ${st}">
            ${app.running ? '<span class="spinner"></span>' : ''}${badgeLabel}
          </span>
        </div>

        ${last ? `
          <div class="stats">
            <div><strong>${last.pass ?? '—'}</strong> passed</div>
            <div><strong>${last.fail ?? '—'}</strong> failed</div>
            <div><strong>${last.total ?? '—'}</strong> total</div>
            <div><strong>${last.duration_ms ? (last.duration_ms/1000).toFixed(1)+'s' : '—'}</strong></div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill ${last.status}" style="width:${pct}%"></div>
          </div>
        ` : `<div style="color:#475569;font-size:0.82rem">No runs yet</div>`}

        <div class="card-footer">
          <button class="btn-run" onclick="triggerRun('${app.id}')" ${app.running || !secret ? 'disabled' : ''}>
            ▶ Run Now
          </button>
          ${last ? `<button class="btn-output" onclick="toggleOutput('${app.id}')">Output</button>` : ''}
          <span class="timestamp">${relTime(last?.finished_at || last?.started_at)}</span>
        </div>

        <pre class="output-panel" id="output-${app.id}">Loading…</pre>
      </div>
    `
  }

  async function load() {
    if (!secret) return
    try {
      const res  = await fetch(`/api/apps`)
      const apps = await res.json()
      const grid = document.getElementById('grid')
      if (!apps.length) { grid.innerHTML = '<div class="empty">No apps registered yet.</div>'; return }
      grid.innerHTML = apps.map(renderCard).join('')
      document.getElementById('refreshInfo').textContent = `Last refreshed ${relTime(new Date().toISOString())}`
    } catch (e) {
      document.getElementById('grid').innerHTML = `<div class="empty">Error loading apps: ${e.message}</div>`
    }
  }

  async function triggerRun(appId) {
    if (!secret) return alert('Enter your SIM_SECRET first')
    const btn = document.querySelector(`#card-${appId} .btn-run`)
    if (btn) btn.disabled = true
    try {
      await fetch(`/api/run/${appId}?secret=${encodeURIComponent(secret)}&source=dashboard`, { method: 'POST' })
      setTimeout(load, 1000)
      setInterval(load, 5000)
    } catch (e) { alert(`Failed to trigger: ${e.message}`) }
  }

  async function toggleOutput(appId) {
    const panel = document.getElementById(`output-${appId}`)
    if (panel.classList.contains('visible')) {
      panel.classList.remove('visible')
      return
    }
    panel.classList.add('visible')
    panel.textContent = 'Loading…'
    try {
      const res = await fetch(`/api/results/${appId}?secret=${encodeURIComponent(secret)}`)
      const data = await res.json()
      const last = data.runs?.[0]
      panel.textContent = last?.output || 'No output available'
    } catch (e) { panel.textContent = `Error: ${e.message}` }
  }

  if (secret) load()
  setInterval(load, 30000)
</script>
</body>
</html>
